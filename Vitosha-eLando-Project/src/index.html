<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <title>VitoshaELandoProject</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>

  <body style="background:#09090b;margin:0"></body>
  <div id="loader" style="
  position:fixed;
  inset:0;
  background:#09090b;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  transition: opacity 0.5s ease;
">
    <span style="
    color:white;
    font-family:'Inter',sans-serif;
    font-size:4rem;
    font-weight:600;
    letter-spacing:-0.02em;
    animation: zoomIn 0.8s ease forwards;
    
  ">
      <div style="display:flex;align-items:center;gap:10px;animation:zoomIn 0.8s ease forwards;">
        <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="white"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span
          style="color:white;font-family:'Inter',sans-serif;font-size:1.25rem;font-weight:600;letter-spacing:-0.02em;">SecureVault</span>
      </div>
    </span>
  </div>

  <style>
    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loader');
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }, 2000);
    });
  </script>
  <app-root></app-root>
</body>

</html>
