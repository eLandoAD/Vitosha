<div class="min-h-screen bg-zinc-950 flex">
    <div class="w-full md:w-1/2 flex flex-col justify-between px-12 py-16">
        <div>
            <h1 class="text-white text-xl font-semibold tracking-tight">SecureVault</h1>
        </div>

        <div>
            <p class="text-zinc-600 text-xs uppercase tracking-widest mb-3">Security</p>
            <h2 class="text-white text-4xl font-light mb-4">Change your<br>password</h2>
            <p class="text-zinc-600 text-xs mb-10 max-w-sm">Your current password is required to re-encrypt your vault.
                Your files will remain accessible.</p>

            <div class="flex flex-col gap-3 max-w-sm">
                <input type="password" #oldPassword placeholder="Current password"
                    class="bg-transparent border-b border-zinc-700 text-white text-sm py-3 placeholder-zinc-600 focus:outline-none focus:border-zinc-400 transition">

                <input type="password" #newPassword placeholder="New password"
                    class="bg-transparent border-b border-zinc-700 text-white text-sm py-3 placeholder-zinc-600 focus:outline-none focus:border-zinc-400 transition"
                    (keyup.enter)="onChangePassword(oldPassword.value, newPassword.value)">

                <button (click)="onChangePassword(oldPassword.value, newPassword.value)"
                    class="mt-6 self-start bg-white text-zinc-900 text-sm font-medium px-8 py-3 rounded-full hover:bg-zinc-200 transition">
                    Update password
                </button>
            </div>
        </div>

        <div class="flex gap-6 text-zinc-600 text-xs">
            <button (click)="goBack()" class="hover:text-white transition">Back to dashboard</button>
        </div>
    </div>

    <div class="hidden md:flex w-1/2 bg-zinc-900 border-l border-zinc-800 items-end px-12 py-16">
        <p class="text-zinc-700 text-xs leading-relaxed max-w-xs">
            Your encryption keys are re-wrapped locally in your browser. Your files are never re-uploaded or exposed.
        </p>
    </div>
</div>
